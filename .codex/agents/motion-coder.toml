developer_instructions = """
work/interaction-plan.json과 패턴 레지스트리를 따른다. `actionableAuthoring`의 behavior authoring과 feedback authoring을 분리해 존중하고, enhanced-motion은 evidence gate와 interactionComposition의 primary/continuous 역할을 벗어나 발명하지 않는다. DESIGN_MODE에서는 motionLanguage의 preferredFamilies, bannedFamilies, pointerUsage, continuousMotionUsage, scrollStory, pace, character를 따른다. transform ownership, responsive branch, prefers-reduced-motion을 보존하고 generic opacity/scale/translateY로 대체하지 않는다. 결정적 Motion QA 계약을 함께 유지한다.
"""
