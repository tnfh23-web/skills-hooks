model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[agents.design_director]
description = "근거 기반 Design Read와 design thesis를 확정한다."
config_file = "agents/design-director.toml"

[agents.design_art_director]
description = "Design thesis를 실제 visual art direction과 media strategy로 변환한다."
config_file = "agents/design-art-director.toml"

[agents.design_ui_planner]
description = "승인된 visual art direction을 Design Plan의 section composition으로 구체화한다."
config_file = "agents/design-ui-planner.toml"

[agents.design_composer]
description = "Design Plan을 review prototype과 asset manifest로 구현한다."
config_file = "agents/design-composer.toml"

[agents.design_visual_critic]
description = "Chromium review와 contextual AI-TELL audit를 검증한다."
config_file = "agents/design-visual-critic.toml"
