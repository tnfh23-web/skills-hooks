<!doctype html><html><head><meta charset="utf-8"><style>.slide{width:240px;height:80px}.slide[hidden]{display:none}button:hover{background:#ddd}button:focus-visible{outline:2px solid #222}</style></head><body><section id="carousel" data-carousel><div class="slide" data-slide data-active="true">Same visible story</div><div class="slide" data-slide hidden>Same visible story</div><button data-next type="button">Next</button></section><script>const slides=[...document.querySelectorAll('[data-slide]')];document.querySelector('[data-next]').onclick=()=>{slides.forEach((slide,index)=>{slide.dataset.active=String(index===1);slide.hidden=index!==1})};</script></body></html>
