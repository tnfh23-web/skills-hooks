<!doctype html><html><body><section id="carousel" data-carousel><div class="slide active" data-slide data-active="true">A</div><div class="slide" data-slide hidden>B</div><button data-next>Next</button><span data-current>1</span>/<span data-total>2</span></section><script>const s=[...document.querySelectorAll('.slide')];document.querySelector('[data-next]').onclick=()=>{s[0].classList.remove('active');delete s[0].dataset.active;s[0].hidden=true;s[1].classList.add('active');s[1].dataset.active='true';s[1].hidden=false};</script></body></html>
