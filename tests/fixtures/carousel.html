<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:Arial}.carousel{width:320px;overflow:hidden}.slides{display:flex}.slide{flex:0 0 320px;height:100px;display:none}.slide.active{display:block}.counter{padding:8px}.progress{height:4px;background:#ddd}.progress i{display:block;height:100%;width:33%;background:#222}button:hover{background:#ddd}button:focus-visible{outline:2px solid #222;outline-offset:2px}</style></head><body><section class="carousel" data-slider><div class="slides"><div class="slide active" data-slide="0" data-active="true">A</div><div class="slide" data-slide="1">B</div><div class="slide" data-slide="2">C</div></div><button type="button" data-qa-action="next" aria-label="Next slide">Next</button><div class="counter"><b data-current>01</b> / <span data-total>03</span></div><div class="progress" role="progressbar" aria-valuenow="1"><i data-progress></i></div></section><script>const slides=[...document.querySelectorAll('.slide')];const current=document.querySelector('[data-current]');const progress=document.querySelector('[data-progress]');document.querySelector('[data-qa-action]').onclick=()=>{const index=(Number(current.textContent)-1+1)%slides.length;slides.forEach((slide,i)=>{slide.classList.toggle('active',i===index);if(i===index)slide.dataset.active='true';else delete slide.dataset.active});current.textContent=String(index+1).padStart(2,'0');progress.style.width=`${(index+1)/slides.length*100}%`;document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',String(index+1));};</script></body></html>
