<!doctype html><html lang="en"><head><meta charset="utf-8"><style>html{font-size:62.5%}body{margin:0;font:1.6rem Arial}.root{height:180rem;padding:2rem}.pin{position:sticky;top:0;height:18rem}.viewport{width:100%;height:18rem;overflow:visible}.track{display:flex;width:300%;height:12rem}.card{flex:0 0 33.333%;padding:2rem;background:#ddf}</style></head><body><section id="horizontal-root" class="root"><div id="horizontal-pin" class="pin"><div id="horizontal-viewport" class="viewport"><div id="horizontal-track" class="track" data-state="start"><div class="card">One</div><div class="card">Two</div><div class="card">Three</div></div></div><div id="horizontal-mobile-fallback">Mobile fallback</div></div></section><script>const root=document.querySelector('#horizontal-root'),pin=document.querySelector('#horizontal-pin'),track=document.querySelector('#horizontal-track'),viewport=document.querySelector('#horizontal-viewport');addEventListener('scroll',()=>{const p=Math.max(0,Math.min(1,(scrollY-root.offsetTop)/Math.max(1,root.offsetHeight-innerHeight)));track.dataset.state=p<.2?'start':p<.55?'track-progress':p<.9?'end':'pin-released';track.style.transform=`translateX(${p*100}px)`});</script></body></html>
