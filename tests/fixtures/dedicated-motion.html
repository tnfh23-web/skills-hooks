<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dedicated motion contracts</title><style>
*{box-sizing:border-box}html{font-size:62.5%}body{margin:0;font:1.6rem Arial,sans-serif;overflow-x:hidden}.block{position:relative;height:180rem;padding:2rem}.pin-sample,.scene-sample{position:sticky;top:10rem;min-height:12rem;padding:3rem;background:#dff}.scene-sample{background:#ffe}.scene{display:none;padding:2rem;background:#fff}.scene.active{display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.split-visual{font-size:4rem;min-height:8rem}.split-visual span{display:inline-block;margin-right:.2rem;background:#fed;padding:.2rem}.horizontal-viewport{position:relative;overflow:hidden;width:100%;height:18rem}.horizontal-pin{position:sticky;top:0;height:18rem;padding:2rem;background:#eef}.horizontal-track{display:flex;width:300%;height:12rem;transform:translateX(0);transition:none}.horizontal-card{flex:0 0 33.333%;padding:2rem;background:#ddf}.mobile-fallback{display:none}@media(max-width:500px){.mobile-fallback{display:block;padding:2rem;background:#dfd}.horizontal-viewport,.horizontal-pin,.horizontal-track{height:auto;position:static}.horizontal-track{width:100%;display:block;transform:none!important}.horizontal-card{display:none}.horizontal-card:first-child{display:block}}@media(prefers-reduced-motion:reduce){.pin-sample,.scene-sample,.split-visual,.horizontal-track{transform:none!important}}
</style></head><body>
<section id="pin-root" class="block"><div id="pin-sample" class="pin-sample" data-state="start" data-essential>Pin scrub</div></section>
<section id="scene-root" class="block"><div id="scene-sample" class="scene-sample" data-state="previous-scene" data-essential><div id="scene-a" class="scene active" data-scene="previous">Previous scene</div><div id="scene-b" class="scene" data-scene="active">Active scene</div><div id="scene-c" class="scene" data-scene="next">Next scene</div></div></section>
<section id="split-root" class="block"><span id="split-original" class="sr-only" aria-label="Accessible split text">Accessible split text</span><div id="split-sample" data-state="unsplit-accessible-text" data-essential><div id="split-visual" class="split-visual"><span aria-hidden="true">Accessible</span><span aria-hidden="true">split</span><span aria-hidden="true">text</span></div></div></section>
<section id="horizontal-root" class="block"><div id="horizontal-pin" class="horizontal-pin"><div id="horizontal-viewport" class="horizontal-viewport"><div id="horizontal-track" class="horizontal-track" data-state="start"><div class="horizontal-card">One</div><div class="horizontal-card">Two</div><div class="horizontal-card">Three</div></div></div><div id="horizontal-mobile-fallback" class="mobile-fallback">Mobile vertical fallback</div></div></section>
<script>
const clamp=(value)=>Math.max(0,Math.min(1,value));
function progress(root){return clamp((scrollY-root.offsetTop)/Math.max(1,root.offsetHeight-innerHeight));}
const pinRoot=document.querySelector('#pin-root'),pin=document.querySelector('#pin-sample');
const sceneRoot=document.querySelector('#scene-root'),scene=document.querySelector('#scene-sample'),scenes=[...document.querySelectorAll('[data-scene]')];
const splitRoot=document.querySelector('#split-root'),split=document.querySelector('#split-sample');
const horizontalRoot=document.querySelector('#horizontal-root'),horizontalPin=document.querySelector('#horizontal-pin'),horizontalTrack=document.querySelector('#horizontal-track'),horizontalViewport=document.querySelector('#horizontal-viewport');
function update(){
 const pinProgress=progress(pinRoot); pin.dataset.state=pinProgress<.2?'start':pinProgress<.55?'intermediate':pinProgress<.9?'final':'pin-released'; pin.style.position=pinProgress>=.9?'absolute':'sticky';
 const sceneProgress=progress(sceneRoot); scene.dataset.state=sceneProgress<.2?'previous-scene':sceneProgress<.5?'active-scene':sceneProgress<.9?'next-scene':'final-safe-state'; const sceneIndex=sceneProgress<.2?0:sceneProgress<.5?1:2; scenes.forEach((node,index)=>node.classList.toggle('active',index===sceneIndex));
 const splitProgress=progress(splitRoot); split.dataset.state=matchMedia('(prefers-reduced-motion: reduce)').matches?'reduced-motion':splitProgress<.2?'unsplit-accessible-text':splitProgress<.5?'split-ready':'revealed';
 const horizontalProgress=progress(horizontalRoot); horizontalTrack.dataset.state=horizontalProgress<.2?'start':horizontalProgress<.55?'track-progress':horizontalProgress<.9?'end':'pin-released'; const available=Math.max(0,horizontalTrack.scrollWidth-horizontalViewport.clientWidth); horizontalTrack.style.transform=matchMedia('(prefers-reduced-motion: reduce)').matches?'none':`translateX(${-available*horizontalProgress}px)`; horizontalPin.style.position=horizontalProgress>=.9?'absolute':'sticky';
} addEventListener('scroll',update,{passive:true});addEventListener('resize',update);update();
</script></body></html>
