<!doctype html><html lang="en"><head><meta charset="utf-8"><style>html{font-size:62.5%}body{margin:0;font:1.6rem Arial;overflow-x:hidden}.root{height:180rem;padding:2rem}.sample{position:sticky;top:10rem;min-height:12rem;background:#dff;transform:translateX(0)}</style></head><body><section id="pin-root" class="root"><div id="pin-sample" class="sample" data-state="start">Pin never releases</div></section><script>const root=document.querySelector('#pin-root'),sample=document.querySelector('#pin-sample');addEventListener('scroll',()=>{const p=Math.max(0,Math.min(1,(scrollY-root.offsetTop)/Math.max(1,root.offsetHeight-innerHeight)));sample.dataset.state=p<.2?'start':p<.55?'intermediate':p<.9?'final':'pin-released';sample.style.transform=`translateX(${p*100}px)`});</script></body></html>
