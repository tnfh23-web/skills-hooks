<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{font-size:62.5%}body{margin:0;font:1.6rem Arial;overflow-x:hidden}.root{height:180rem;padding:2rem}.sample{position:sticky;top:10rem;min-height:12rem;background:#ffe;transform:translateX(0)}.scene{display:none}.scene.active{display:block}</style></head><body><section id="scene-root" class="root"><div id="scene-sample" class="sample" data-state="previous-scene"><div id="scene-a" class="scene active" data-scene="previous">Previous</div><div id="scene-b" class="scene" data-scene="active">Active</div><div id="scene-c" class="scene" data-scene="next">Next</div></div></section><script>const root=document.querySelector('#scene-root'),sample=document.querySelector('#scene-sample');addEventListener('scroll',()=>{const p=Math.max(0,Math.min(1,(scrollY-root.offsetTop)/Math.max(1,root.offsetHeight-innerHeight)));sample.dataset.state=p<.2?'previous-scene':p<.5?'active-scene':p<.9?'next-scene':'final-safe-state';sample.style.transform=`translateX(${p*100}px)`});</script></body></html>
