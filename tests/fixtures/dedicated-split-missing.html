<!doctype html><html lang="en"><head><meta charset="utf-8"><style>html{font-size:62.5%}body{margin:0;font:1.6rem Arial;overflow-x:hidden}.root{height:180rem;padding:2rem}.sample{position:sticky;top:10rem;min-height:12rem}.visual{font-size:4rem}.visual span{display:inline-block;background:#fed;margin:.2rem}</style></head><body><section id="split-root" class="root"><div id="split-sample" class="sample" data-state="unsplit-accessible-text"><div id="split-visual" class="visual"><span>Missing</span><span>accessible</span><span>original</span></div></div></section><script>const root=document.querySelector('#split-root'),sample=document.querySelector('#split-sample');addEventListener('scroll',()=>{const p=Math.max(0,Math.min(1,(scrollY-root.offsetTop)/Math.max(1,root.offsetHeight-innerHeight)));sample.dataset.state=p<.2?'unsplit-accessible-text':p<.5?'split-ready':'revealed'});</script></body></html>
