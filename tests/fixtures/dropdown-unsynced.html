<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Broken dropdown contract</title><style>body{font:16px Arial;margin:2rem}.panel{display:none;padding:1rem}</style></head>
<body><section id="dropdown-root"><button id="dropdown-control" aria-expanded="false" aria-controls="dropdown-panel">Dropdown</button><div id="dropdown-panel" class="panel">Never visible</div></section>
<script>document.querySelector('#dropdown-control').onclick=()=>document.querySelector('#dropdown-control').setAttribute('aria-expanded','true');</script></body></html>
